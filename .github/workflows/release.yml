name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: media-browser-windows-x64.exe

          - os: windows-latest
            target: aarch64-pc-windows-msvc
            name: media-browser-windows-arm64.exe

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: media-browser-linux-x64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            name: media-browser-linux-arm64
            use-cross: true

          - os: macos-latest
            target: x86_64-apple-darwin
            name: media-browser-macos-x64

          - os: macos-latest
            target: aarch64-apple-darwin
            name: media-browser-macos-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build binary
        if: ${{ !matrix.use-cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build binary using Cross (Linux ARM64)
        if: ${{ matrix.use-cross }}
        run: |
          cargo install cross --git https://github.com/cross-rs/cross
          cross build --release --target ${{ matrix.target }}

      - name: Rename output binary (Unix)
        if: runner.os != 'Windows'
        run: mv target/${{ matrix.target }}/release/app target/${{ matrix.target }}/release/${{ matrix.name }}

      - name: Rename output binary (Windows)
        if: runner.os == 'Windows'
        run: mv target/${{ matrix.target }}/release/app.exe target/${{ matrix.target }}/release/${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: target/${{ matrix.target }}/release/${{ matrix.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Display downloaded files
        run: ls -la artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
