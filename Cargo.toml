[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
askama = "0.16.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
futures = "0.3.32"
mime_guess = "2.0.5"
notify = "8.2.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
rust-embed = { version = "8.11.0", features = ["debug-embed"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = { version = "1.52.3", features = ["full", "rt-multi-thread", "macros"] }
tokio-util = { version = "0.7.18", features = ["io"] }
tower-http = { version = "0.6.10", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
urlencoding = "2.1.3"
walkdir = "2.5.0"
which = "8.0.2"
