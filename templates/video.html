<!DOCTYPE html>
<html>
<head>
    <title>Video - Rust Media Browser</title>
    <link rel="stylesheet" href="/assets/style.css">

    <!-- Plyr CSS -->
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

    <style>
        .view-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            max-width: 1000px;
            margin: 0 auto;
        }
        .video-wrapper {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .meta {
            margin-top: 1rem;
            background: #fff;
            padding: 1rem;
            border-radius: 8px;
            width: 100%;
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
        }
        .meta h3 {
            width: 100%;
            margin: 0 0 0.25rem;
        }
        .meta p {
            margin: 0;
            flex: 1;
        }
        .btn {
            display: inline-block;
            padding: 0.4rem 0.9rem;
            border-radius: 4px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
            color: inherit;
        }
        .btn:hover { background: #e8e8e8; }
    </style>
</head>
<body>
    <header>
        <h1>Media Browser</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/config">Config</a>
        </nav>
    </header>
    <div class="view-container">
        <div class="video-wrapper">
            <video id="player" controls crossorigin playsinline>
                <source src="/hls/{{ file.id }}/master.m3u8" type="application/x-mpegURL">
                {% if file.vtt_path.is_some() %}
                <track kind="metadata" label="thumbnails" src="/.app_data/vtt/{{ file.id }}.vtt" default>
                {% endif %}
            </video>
        </div>

        <div class="meta">
            <h3>{{ file.path }}</h3>
            <p>Size: {{ (file.size_bytes / 1048576) }} MB</p>
            <a class="btn" href="/media/{{ file.path|urlencode }}" download>Download</a>
            <button class="btn" id="screenshot-btn">Screenshot</button>
        </div>
    </div>

    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <!-- Plyr -->
    <script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const video = document.querySelector('#player');
            const source = video.getElementsByTagName('source')[0].src;
            let player = null;

            const defaultOptions = {
                controls: ['play-large', 'play', 'progress', 'current-time', 'mute', 'volume', 'captions', 'settings', 'pip', 'airplay', 'fullscreen'],
                previewThumbnails: {
                    enabled: true,
                    src: video.querySelector('track') ? video.querySelector('track').src : null
                }
            };

            if (Hls.isSupported()) {
                const hls = new Hls({
                    maxBufferLength: 30,
                    maxMaxBufferLength: 60,
                });
                hls.loadSource(source);
                hls.attachMedia(video);
                window.hls = hls;

                hls.on(Hls.Events.MANIFEST_PARSED, function () {
                    player = new Plyr(video, defaultOptions);
                    window.player = player;
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = source;
                player = new Plyr(video, defaultOptions);
                window.player = player;
            } else {
                video.src = "/media/{{ file.path|urlencode }}";
                player = new Plyr(video, defaultOptions);
                window.player = player;
            }

            document.getElementById('screenshot-btn').addEventListener('click', () => {
                const t = (player ? player.currentTime : video.currentTime) || 0;
                window.location.href = `/screenshot/{{ file.id }}?t=${t}`;
            });
        });
    </script>
</body>
</html>
